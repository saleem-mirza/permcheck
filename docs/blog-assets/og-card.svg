<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" role="img" aria-label="When deny doesn't win. A broad deny on aws and a narrower allow on aws describe commands. The same call is blocked by the native model and allowed by permcheck.">
  <title>When deny doesn't win</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#17263f"/>
      <stop offset="1" stop-color="#0e1726"/>
    </linearGradient>
    <style>
      .eyebrow { font-size: 20px; font-weight: 700; fill: #86b7ff; letter-spacing: 3.4px; }
      .title   { font-size: 92px; font-weight: 800; fill: #ffffff; letter-spacing: -2.6px; }
      .mono    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 34px; }
      .cmd     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 27px; fill: #b9cae3; }
      .pill    { font-size: 26px; font-weight: 800; fill: #ffffff; letter-spacing: 0.4px; }
      .foot    { font-size: 22px; fill: #8fa3bd; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g>
    <rect x="80" y="60" width="40" height="7" rx="3.5" fill="#3fb950"/>
    <rect x="124" y="60" width="40" height="7" rx="3.5" fill="#d29922"/>
    <rect x="168" y="60" width="40" height="7" rx="3.5" fill="#f85149"/>
  </g>
  <text x="80" y="112" class="eyebrow">PERMISSION ENGINEERING · CLAUDE CODE</text>

  <text x="80" y="212" class="title">When deny doesn't win</text>

  <rect x="80" y="252" width="1040" height="134" rx="16" fill="#ffffff" fill-opacity="0.045" stroke="#2c3f5c" stroke-width="1.5"/>
  <text x="118" y="305" class="mono" fill="#ff9aa2">deny:  <tspan fill="#e6eefb">Bash(aws:*)</tspan></text>
  <text x="118" y="355" class="mono" fill="#86e6a0">allow: <tspan fill="#e6eefb">Bash(aws * describe-*)</tspan></text>

  <text x="80" y="440" class="cmd">aws ec2 describe-instances</text>

  <rect x="80" y="466" width="322" height="60" rx="30" fill="#cf222e"/>
  <text x="241" y="505" class="pill" text-anchor="middle">native ▸ BLOCKED</text>

  <rect x="422" y="466" width="372" height="60" rx="30" fill="#1a7f37"/>
  <text x="608" y="505" class="pill" text-anchor="middle">permcheck ▸ ALLOWED</text>

  <text x="80" y="580" class="foot">blogs.zethian.com · Saleem Mirza</text>
</svg>
