<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="A tool call passes through the PreToolUse hook, permcheck scores it, and the verdict is allow, ask, or deny.">
  <title>permcheck as the PreToolUse gate</title>
  <defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker></defs>
  <line x1="162" y1="115" x2="193" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="337" y1="115" x2="368" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="557" y1="115" x2="588" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="682" y1="108" x2="708" y2="60" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="682" y1="115" x2="708" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah1)"/>
  <line x1="682" y1="122" x2="708" y2="170" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah1)"/>
  <g font-size="13" fill="#1f2328" text-anchor="middle">
    <rect x="10" y="88" width="152" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="86" y="110">Claude wants</text><text x="86" y="127">to run a tool</text>
    <rect x="193" y="88" width="144" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="265" y="119">PreToolUse hook</text>
    <rect x="368" y="82" width="189" height="66" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="462" y="110">permcheck scores it</text><text x="462" y="127">against your rules</text>
    <rect x="588" y="88" width="94" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="635" y="119">Verdict</text>
    <rect x="708" y="38" width="142" height="44" rx="8" fill="#1a7f37"/><text x="779" y="65" fill="#fff">allow → runs</text>
    <rect x="708" y="93" width="142" height="44" rx="8" fill="#9a6700"/><text x="779" y="120" fill="#fff">ask → prompt</text>
    <rect x="708" y="148" width="142" height="44" rx="8" fill="#cf222e"/><text x="779" y="175" fill="#fff">deny → blocked</text>
  </g>
</svg>
