<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The same aws describe call is blocked by the native deny-always-wins model but allowed by permcheck, where the higher-specificity allow beats the broad deny.">
  <title>Native model versus permcheck on the same call</title>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
    <marker id="ah2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
  </defs>
  <rect x="315" y="12" width="230" height="42" rx="8" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
  <text x="430" y="38" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="#1f2328">aws ec2 describe-instances</text>
  <line x1="400" y1="54" x2="230" y2="86" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="460" y1="54" x2="640" y2="86" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah2)"/>

  <rect x="20" y="86" width="400" height="298" rx="10" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="220" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#cf222e" letter-spacing="1">NATIVE MODEL</text>
  <rect x="70" y="132" width="300" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="220" y="159" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="#1f2328">allow: aws * describe-*</text>
  <rect x="70" y="210" width="300" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="220" y="237" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="#1f2328">deny: aws:*</text>
  <rect x="115" y="312" width="210" height="52" rx="8" fill="#cf222e"/>
  <text x="220" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">deny wins → BLOCKED</text>
  <line x1="220" y1="254" x2="220" y2="310" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="150" y1="176" x2="150" y2="312" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah2d)"/>
  <text x="120" y="250" text-anchor="middle" font-size="11" font-style="italic" fill="#8c959f">ignored</text>

  <rect x="440" y="86" width="400" height="298" rx="10" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="640" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0969da" letter-spacing="1">permcheck</text>
  <rect x="490" y="132" width="300" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="640" y="159" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="#1f2328">allow: aws * describe-*  ·  14</text>
  <rect x="490" y="210" width="300" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="640" y="237" text-anchor="middle" font-size="13" font-family="ui-monospace, monospace" fill="#1f2328">deny: aws:*  ·  3</text>
  <rect x="525" y="312" width="230" height="52" rx="8" fill="#1a7f37"/>
  <text x="640" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">specific wins → ALLOWED</text>
  <line x1="640" y1="176" x2="640" y2="310" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah2)"/>
  <line x1="710" y1="254" x2="710" y2="312" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah2d)"/>
  <text x="740" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#8c959f">loses</text>
</svg>
