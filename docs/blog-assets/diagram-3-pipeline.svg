<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" width="840" height="600" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Evaluation pipeline: route by tool to path glob, URL match, or Bash split; Bash also peels wrappers and cross-checks file access; then every matching rule is scored and the most specific wins. Any error fails closed to deny.">
  <title>The permcheck evaluation pipeline</title>
  <defs><marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
  <marker id="ah3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker></defs>

  <line x1="410" y1="60" x2="410" y2="93" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="360" y1="128" x2="150" y2="168" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="410" y1="139" x2="410" y2="168" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="460" y1="128" x2="670" y2="168" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="670" y1="212" x2="670" y2="240" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="670" y1="294" x2="670" y2="322" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="150" y1="212" x2="360" y2="402" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="410" y1="212" x2="410" y2="402" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="670" y1="376" x2="470" y2="410" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="410" y1="458" x2="410" y2="486" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="410" y1="530" x2="410" y2="558" stroke="#57606a" stroke-width="1.5" marker-end="url(#ah3)"/>
  <polyline points="490,117 810,117 810,400" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah3r)"/>
  <text x="650" y="110" text-anchor="middle" font-size="11" font-style="italic" fill="#cf222e">on any error</text>

  <g text-anchor="middle">
    <rect x="345" y="20" width="130" height="40" rx="20" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/><text x="410" y="45" font-size="13" fill="#1f2328">Tool call</text>
    <rect x="330" y="93" width="160" height="46" rx="23" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="410" y="121" font-size="13" fill="#1f2328">Which tool?</text>

    <rect x="55" y="168" width="190" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="150" y="195" font-size="12.5" fill="#1f2328">Glob-match the path</text>
    <rect x="315" y="168" width="190" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="410" y="195" font-size="12.5" fill="#1f2328">Match URL or string</text>
    <rect x="575" y="168" width="190" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="670" y="195" font-size="12.5" fill="#1f2328">Split into units (Bash)</text>

    <rect x="565" y="240" width="210" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="670" y="264" font-size="12.5" fill="#1f2328">Peel wrappers</text><text x="670" y="281" font-size="12.5" fill="#1f2328">env · sudo · timeout</text>
    <rect x="565" y="322" width="210" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="670" y="346" font-size="12.5" fill="#1f2328">File-access cross-check</text><text x="670" y="363" font-size="12.5" fill="#1f2328">vs Read/Write deny</text>

    <rect x="280" y="402" width="260" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="410" y="426" font-size="12.5" fill="#1f2328">Score EVERY matching rule</text><text x="410" y="444" font-size="12.5" fill="#1f2328">specificity, then tier</text>
    <rect x="305" y="486" width="210" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="410" y="513" font-size="13" fill="#1f2328">Most specific rule wins</text>
    <rect x="305" y="558" width="210" height="44" rx="22" fill="#0969da"/><text x="410" y="585" font-size="13" font-weight="700" fill="#fff">allow / ask / deny</text>

    <rect x="620" y="402" width="200" height="56" rx="8" fill="#cf222e"/><text x="720" y="426" font-size="12" fill="#fff">bad input · unknown tool</text><text x="720" y="444" font-size="12" font-weight="700" fill="#fff">deny (fail-closed)</text>
  </g>
</svg>
