<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Evaluation pipeline: a tool call routes by family to path globs, generic matching, or the Bash split. The Bash route adds wrapper peeling and a file-access cross-check. All three routes converge on scoring every matching rule, and the verdict is allow, ask, or deny. Bad input, unreadable rules, or a panic fail closed to deny.">
  <title>The permcheck evaluation pipeline</title>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
    <marker id="ah3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
    <style>
      .flow { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#ah3); }
      .fail { fill: none; stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#ah3r); }
      .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .t { font-size: 12.5px; fill: #1f2328; }
      .sub { font-size: 11.5px; fill: #57606a; }
      .lane { font-size: 11px; fill: #57606a; letter-spacing: 1px; }
    </style>
  </defs>

  <g text-anchor="middle">
    <rect x="365" y="16" width="130" height="38" rx="19" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
    <text x="430" y="40" class="t">Tool call</text>

    <rect x="350" y="82" width="160" height="44" rx="22" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
    <text x="430" y="110" class="t">Which family?</text>

    <rect class="node" x="70" y="166" width="180" height="44" rx="10"/>
    <text x="160" y="186" class="t">Path glob</text>
    <text x="160" y="202" class="sub">Read · Write · Edit</text>

    <rect class="node" x="340" y="166" width="180" height="44" rx="10"/>
    <text x="430" y="186" class="t">Generic match</text>
    <text x="430" y="202" class="sub">any other tool, mcp__*</text>

    <rect class="node" x="610" y="166" width="180" height="44" rx="10"/>
    <text x="700" y="186" class="t">Bash</text>
    <text x="700" y="202" class="sub">split into units</text>

    <rect class="node" x="600" y="240" width="200" height="48" rx="10"/>
    <text x="700" y="262" class="t">peel wrappers</text>
    <text x="700" y="279" class="sub">env · sudo · timeout · xargs</text>

    <rect class="node" x="600" y="318" width="200" height="48" rx="10"/>
    <text x="700" y="340" class="t">cross-check file operands</text>
    <text x="700" y="357" class="sub">against Read/Write denies</text>

    <rect x="290" y="400" width="280" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="430" y="424" class="t">score every matching rule</text>
    <text x="430" y="442" class="sub">carve-outs first, then specificity</text>

    <rect x="330" y="488" width="200" height="44" rx="22" fill="#0969da"/>
    <text x="430" y="516" font-size="13" font-weight="700" fill="#ffffff">allow / ask / deny</text>

    <rect x="600" y="478" width="230" height="54" rx="10" fill="#cf222e"/>
    <text x="715" y="502" font-size="12" fill="#ffffff">bad stdin · bad rules · panic</text>
    <text x="715" y="520" font-size="12" font-weight="700" fill="#ffffff">deny (fail-closed)</text>
  </g>

  <path class="flow" d="M430 54 V76"/>
  <path class="flow" d="M430 126 V136 Q430 146 420 146 H170 Q160 146 160 156 V160"/>
  <path class="flow" d="M430 126 V160"/>
  <path class="flow" d="M430 126 V136 Q430 146 440 146 H690 Q700 146 700 156 V160"/>

  <path class="flow" d="M700 210 V234"/>
  <path class="flow" d="M700 288 V312"/>

  <path class="flow" d="M160 210 V418 Q160 428 170 428 H284"/>
  <path class="flow" d="M430 210 V394"/>
  <path class="flow" d="M700 366 V418 Q700 428 690 428 H576"/>
  <path class="flow" d="M430 456 V482"/>

  <path class="fail" d="M495 35 H810 Q820 35 820 45 V472"/>
  <text x="812" y="120" class="lane" text-anchor="end" font-style="italic" fill="#cf222e">on any error</text>
  <text x="592" y="231" class="lane" text-anchor="end">Bash adds two steps first</text>
</svg>
