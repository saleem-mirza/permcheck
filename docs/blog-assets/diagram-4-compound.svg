<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="-apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="The command ls and sudo rm -rf slash splits into two units; ls allows, the sudo unit peels to rm -rf slash and denies, so the most restrictive verdict denies the whole line.">
  <title>Compound Bash decomposition</title>
  <defs>
    <marker id="ah4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606a"/></marker>
    <style>
      .flow { fill: none; stroke: #57606a; stroke-width: 1.5; marker-end: url(#ah4); }
      .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .t { font-size: 13px; fill: #1f2328; }
      .m { font-size: 13px; font-family: ui-monospace, SFMono-Regular, monospace; fill: #1f2328; }
      .w { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
      .step { font-size: 11px; fill: #57606a; letter-spacing: 1px; }
    </style>
  </defs>

  <g text-anchor="middle">
    <rect x="280" y="16" width="300" height="42" rx="10" fill="#eaeef2" stroke="#57606a" stroke-width="1.5"/>
    <text x="430" y="43" class="m">ls &amp;&amp; sudo rm -rf /</text>
  </g>
  <path class="flow" d="M430 58 V70 Q430 80 420 80 H230 Q220 80 220 90 V96"/>
  <path class="flow" d="M430 58 V70 Q430 80 440 80 H630 Q640 80 640 90 V96"/>
  <text x="446" y="76" class="step" text-anchor="start">split on &amp;&amp;</text>

  <g text-anchor="middle">
    <rect class="node" x="135" y="100" width="170" height="42" rx="10"/>
    <text x="220" y="127" class="m">ls</text>
    <rect class="node" x="530" y="100" width="220" height="42" rx="10"/>
    <text x="640" y="127" class="m">sudo rm -rf /</text>

    <rect x="160" y="174" width="120" height="40" rx="10" fill="#1a7f37"/>
    <text x="220" y="200" class="w">allow</text>

    <rect x="545" y="174" width="190" height="40" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
    <text x="640" y="199" class="t">peel wrapper: sudo</text>
    <rect class="node" x="545" y="246" width="190" height="40" rx="10"/>
    <text x="640" y="272" class="m">rm -rf /</text>
    <rect x="580" y="318" width="120" height="40" rx="10" fill="#cf222e"/>
    <text x="640" y="344" class="w">deny</text>

    <rect x="315" y="380" width="230" height="48" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
    <text x="430" y="401" class="t">most restrictive</text>
    <text x="430" y="419" class="t">unit wins</text>

    <rect x="280" y="458" width="300" height="52" rx="10" fill="#cf222e"/>
    <text x="430" y="490" class="w">DENY the whole line</text>
  </g>

  <path class="flow" d="M220 142 V168"/>
  <path class="flow" d="M640 142 V168"/>
  <path class="flow" d="M640 214 V240"/>
  <path class="flow" d="M640 286 V312"/>
  <path class="flow" d="M220 214 V394 Q220 404 230 404 H305"/>
  <path class="flow" d="M640 358 V394 Q640 404 630 404 H555"/>
  <path class="flow" d="M430 428 V452"/>
</svg>
